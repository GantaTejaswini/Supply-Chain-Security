name: Supply-Chain Security CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build Artifacts and Run Security Tests
    runs-on: ubuntu-latest

    env:
      COSIGN_PASSWORD: ci-ephemeral-test-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.2

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sudo sh -s -- -b /usr/local/bin v1.54.1
          syft version

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
          trivy --version

      - name: Create demo artifact
        run: python scripts/create_artifact.py

      - name: Prepare artifact verification fixtures
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          artifact = Path("artifacts/demo-package.zip")
          if not artifact.is_file():
              raise SystemExit("Demo artifact was not created.")

          Path("reports").mkdir(parents=True, exist_ok=True)

          digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
          Path("reports/artifact-sha256.txt").write_text(
              f"SHA-256: {digest}\n",
              encoding="utf-8",
          )

          tampered = Path("artifacts/demo-package-tampered.zip")
          tampered.write_bytes(artifact.read_bytes() + b"\nTAMPERED")

          print(f"Created artifact SHA-256: {digest}")
          print("Created tampered artifact for negative testing.")
          PY

      - name: Generate project SBOM
        run: |
          syft dir:. \
            --exclude '**/.git/**' \
            --exclude '**/.venv/**' \
            --exclude '**/artifacts/**' \
            --exclude '**/reports/**' \
            -o cyclonedx-json@1.6=artifacts/sbom-project.cyclonedx.json

      - name: Validate project SBOM
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/sbom-project.cyclonedx.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          if data.get("bomFormat") != "CycloneDX":
              raise SystemExit("FAIL: SBOM is not CycloneDX.")

          if data.get("specVersion") != "1.6":
              raise SystemExit("FAIL: SBOM is not CycloneDX 1.6.")

          components = data.get("components")
          if not isinstance(components, list) or not components:
              raise SystemExit("FAIL: SBOM contains no components.")

          print(f"PASS: SBOM validated with {len(components)} components.")
          PY

      - name: Scan installed Python dependencies
        run: |
          trivy fs \
            --scanners vuln \
            --vuln-type library \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format json \
            --output reports/trivy-filesystem.json \
            .

      - name: Enforce vulnerability policy
        run: python scripts/vulnerability_gate.py

      - name: Generate temporary CI signing key
        run: |
          rm -f cosign.key cosign.pub
          cosign generate-key-pair

      - name: Sign demo artifact
        run: |
          cosign sign-blob \
            --yes \
            --key cosign.key \
            --bundle artifacts/demo-package.zip.bundle.json \
            artifacts/demo-package.zip

      - name: Provide cross-platform Cosign command
        run: |
          sudo ln -sf "$(command -v cosign)" \
            /usr/local/bin/cosign-windows-amd64

      - name: Run automated tests
        run: python -m pytest -v

      - name: Verify release gate
        run: python scripts/release_gate.py

      - name: Upload SBOM and security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-security-reports
          path: |
            artifacts/sbom-project.cyclonedx.json
            reports/trivy-filesystem.json
            reports/artifact-sha256.txt
          if-no-files-found: warn
          retention-days: 30