name: Supply-Chain Security CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  test:
    name: Build Artifacts and Run Security Tests
    runs-on: ubuntu-latest

    env:
      COSIGN_PASSWORD: ci-ephemeral-test-password
      GH_TOKEN: ${{ github.token }}
      SKIP_PROVENANCE_TESTS: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          curl -sSfL \
            -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan Git history for secrets
        run: gitleaks git . --redact

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Bandit Python security analysis
        run: bandit -r scripts -ll

      - name: Install Cosign
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb

      - name: Verify Cosign installation
        run: |
          set -euo pipefail
          command -v cosign
          cosign version

      - name: Install Syft
        run: |
          set -euo pipefail
          curl -sSfL https://get.anchore.io/syft \
            | sudo env "PATH=$PATH" sh -s -- -b /usr/local/bin -v v1.54.1
          syft version

      - name: Install Trivy
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
          trivy --version

      - name: Create demo artifact
        run: python scripts/create_artifact.py

      - name: Prepare artifact verification fixtures
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          artifact = Path("artifacts/demo-package.zip")

          if not artifact.is_file():
              raise SystemExit("FAIL: Demo artifact was not created.")

          Path("reports").mkdir(parents=True, exist_ok=True)

          digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
          Path("reports/artifact-sha256.txt").write_text(
              f"SHA-256: {digest}\n",
              encoding="utf-8",
          )

          tampered = Path("artifacts/demo-package-tampered.zip")
          tampered.write_bytes(artifact.read_bytes() + b"\nTAMPERED")

          print(f"Created artifact SHA-256: {digest}")
          print("Created tampered artifact for negative testing.")
          PY

      - name: Generate project SBOM
        run: |
          set -euo pipefail
          syft dir:. \
            --exclude '**/.git/**' \
            --exclude '**/.venv/**' \
            --exclude '**/artifacts/**' \
            --exclude '**/reports/**' \
            -o cyclonedx-json@1.6=artifacts/sbom-project.cyclonedx.json

      - name: Validate project SBOM
        run: python scripts/validate_sbom.py artifacts/sbom-project.cyclonedx.json

      - name: Create pinned Python dependency inventory
        run: |
          python -m pip freeze > requirements-ci.txt
          echo "Python dependency inventory:"
          cat requirements-ci.txt
          test -s requirements-ci.txt

      - name: Scan Python dependencies with Trivy
        run: |
          set -euo pipefail
          mkdir -p reports

          trivy fs \
            --scanners vuln \
            --file-patterns "pip:requirements-ci.txt" \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format json \
            --output reports/trivy-filesystem.json \
            .

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("reports/trivy-filesystem.json")

          if not path.is_file():
              raise SystemExit("FAIL: Trivy report was not created.")

          try:
              report = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as error:
              raise SystemExit(f"FAIL: Invalid Trivy JSON: {error}")

          print("Trivy report keys:", list(report.keys()))

          results = report.get("Results")
          if not isinstance(results, list) or not results:
              raise SystemExit(
                  "FAIL: Trivy returned no scan results. "
                  "Review the Trivy output and requirements-ci.txt."
              )

          for result in results:
              print(
                  "Target:", result.get("Target", "unknown"),
                  "| Type:", result.get("Type", "unknown"),
                  "| Vulnerabilities:",
                  len(result.get("Vulnerabilities") or []),
              )

          print("PASS: Trivy produced scan result sections.")
          PY

      - name: Enforce vulnerability policy
        run: python scripts/vulnerability_gate.py

      - name: Generate temporary CI signing key
        run: |
          rm -f cosign.key cosign.pub
          cosign generate-key-pair

      - name: Sign demo artifact
        run: |
          cosign sign-blob \
            --yes \
            --key cosign.key \
            --bundle artifacts/demo-package.zip.bundle.json \
            artifacts/demo-package.zip

      - name: Attest demo artifact provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: artifacts/demo-package.zip

      - name: Provide cross-platform Cosign command
        run: |
          sudo ln -sf "$(command -v cosign)" \
            /usr/local/bin/cosign-windows-amd64

      - name: Run automated tests
        run: python -m pytest -v

      - name: Verify release gate
        if: github.event_name != 'pull_request'
        run: python scripts/release_gate.py

      - name: Upload SBOM and security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supply-chain-security-reports
          path: |
            artifacts/sbom-project.cyclonedx.json
            reports/trivy-filesystem.json
            reports/artifact-sha256.txt
            requirements-ci.txt
          if-no-files-found: warn
          retention-days: 30